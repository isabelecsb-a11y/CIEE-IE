<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel IE</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f1a;
      color: white;
      display: flex;
    }

    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, #ff2e9f, #ff6b00);
      height: 100vh;
      padding: 30px;
    }

    .sidebar h2 {
      margin-bottom: 40px;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 15px 0;
      font-weight: bold;
    }

    .content {
      flex: 1;
      padding: 40px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #1a1a2e;
      padding: 25px;
      border-radius: 15px;
      border: 1px solid #ff2e9f;
      box-shadow: 0 0 15px rgba(255,46,159,0.4);
    }

    strong {
      font-size: 26px;
      color: #ff6b00;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>Painel IE</h2>
  <a href="#">Visão Geral</a>
  <a href="#">Tickets</a>
  <a href="#">Satisfação</a>
  <a href="#">Tags</a>
  <a href="#">Individual</a>
</div>

<div class="content">
  <h1>Visão Geral</h1>

  <div class="cards">
    <div class="card">Total de Tickets<br><strong>1250</strong></div>
    <div class="card">Tickets Resolvidos<br><strong>1080</strong></div>
    <div class="card">Taxa de Resolução<br><strong>86.4%</strong></div>
    <div class="card">Tickets Pendentes<br><strong>120</strong></div>
    <div class="card">Tickets Cancelados<br><strong>50</strong></div>
    <div class="card">Média de Satisfação<br><strong>4.7</strong></div>
  </div>
</div>

</body>
</html>
