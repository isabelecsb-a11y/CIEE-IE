<!DOCTYPE html>
<html>
<head>
  <title>Painel IE</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1e293b;
    }

    .container {
      padding: 50px;
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 40px;
    }

    .upload-box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }

    button {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .card span {
      color: #64748b;
      font-size: 13px;
    }

    .card strong {
      display: block;
      font-size: 24px;
      margin-top: 6px;
      color: #1e3a8a;
    }

    .empty-state {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      color: #64748b;
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Painel de Indicadores IE</h1>
  <div class="subtitle">Dashboard de acompanhamento operacional</div>

  <div class="upload-box">
    <input type="file" id="file">
    <button onclick="upload()">Enviar Relatório</button>
  </div>

  <div id="conteudo"></div>

  <canvas id="grafico" height="100"></canvas>

</div>

<script src="app.js"></script>
</body>
</html>
