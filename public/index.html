<!DOCTYPE html>
<html>
<head>
<title>Painel IE</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --bg: #f6f8fc;
    --card: white;
    --text: #1e293b;
}

body.dark {
    --bg: #0f172a;
    --card: #1e293b;
    --text: white;
}

body {
    margin: 0;
    font-family: Arial;
    background: var(--bg);
    color: var(--text);
    transition: 0.4s;
}

.container {
    padding: 40px;
    max-width: 1400px;
    margin: auto;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.filters {
    display: flex;
    gap: 10px;
    margin: 25px 0;
}

select {
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: var(--card);
    color: var(--text);
}

button {
    background: linear-gradient(90deg,#ff2aad,#ff7a00);
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
    gap: 18px;
}

.card {
    background: var(--card);
    padding: 22px;
    border-radius: 16px;
    transition: 0.3s;
    position: relative;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(255,42,173,0.25);
}

.delta {
    font-size: 14px;
    margin-top: 8px;
}

.up { color: #22c55e; }
.down { color: #ef4444; }

canvas {
    margin-top: 30px;
    background: var(--card);
    padding: 20px;
    border-radius: 16px;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
    <h1>Painel IE</h1>
    <button onclick="toggleTheme()">🌗 Tema</button>
</div>

<div class="filters">
    <select id="mes"></select>
    <select id="ano"></select>
    <button onclick="aplicarFiltro()">Aplicar</button>
</div>

<div id="conteudo"></div>

<canvas id="grafico"></canvas>

</div>

<script src="app.js"></script>
</body>
</html>
