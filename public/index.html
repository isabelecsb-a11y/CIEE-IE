<!DOCTYPE html>
<html>
<head>
  <title>Painel IE</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f6f8fc, #eef2ff);
    color: #1e293b;
}

.container {
    padding: 40px;
    max-width: 1400px;
    margin: auto;
}

h1 {
    font-size: 30px;
    margin-bottom: 25px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.tab {
    padding: 10px 18px;
    background: white;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.tab.active {
    background: linear-gradient(90deg, #ff2aad, #ff7a00);
    color: white;
}

.upload-box {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

button {
    background: linear-gradient(90deg, #ff2aad, #ff7a00);
    border: none;
    padding: 12px 22px;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 18px;
    transition: 0.3s;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent, rgba(255,42,173,0.15), transparent);
    opacity: 0;
    transition: 0.5s;
}

.card:hover::before {
    opacity: 1;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 35px rgba(255,42,173,0.25);
}

.card span {
    font-size: 13px;
    color: #64748b;
}

.card strong {
    display: block;
    font-size: 26px;
    margin-top: 6px;
    background: linear-gradient(90deg, #ff2aad, #ff7a00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

canvas {
    margin-top: 30px;
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.empty-state {
    margin-top: 30px;
    background: white;
    padding: 40px;
    border-radius: 18px;
    text-align: center;
    color: #64748b;
}
</style>
</head>

<body>

<div class="container">

<h1>Painel de Indicadores IE</h1>

<div class="tabs">
    <div class="tab active" onclick="trocarAba('geral')">Visão Geral</div>
    <div class="tab" onclick="trocarAba('mensal')">Mensal</div>
    <div class="tab" onclick="trocarAba('anual')">Anual</div>
    <div class="tab" onclick="trocarAba('ranking')">Ranking</div>
</div>

<div class="upload-box">
    <input type="file" id="file">
    <button onclick="upload()">Enviar Relatório</button>
    <button onclick="window.open('/pdf')">Exportar PDF</button>
</div>

<div id="conteudo"></div>

<canvas id="grafico" height="100"></canvas>

</div>

<script src="app.js"></script>
</body>
</html>
