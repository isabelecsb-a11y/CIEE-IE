<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel IE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #14001f, #0b0014);
    color: white;
    display: flex;
}

.sidebar {
    width: 240px;
    background: linear-gradient(180deg, #ff2aad, #ff7a00);
    height: 100vh;
    padding: 30px 20px;
}

.sidebar h2 {
    margin-bottom: 40px;
}

.sidebar a {
    display: block;
    color: white;
    text-decoration: none;
    margin-bottom: 20px;
    font-weight: bold;
}

.main {
    flex: 1;
    padding: 40px;
}

h1 {
    margin-bottom: 30px;
    font-size: 32px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 25px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 42, 173, 0.3);
    box-shadow: 0 0 20px rgba(255, 42, 173, 0.25);
}

.card strong {
    font-size: 26px;
    display: block;
    margin-top: 10px;
    color: #ff7a00;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Painel IE</h2>
    <a href="#">Visão Geral</a>
    <a href="#">Tickets</a>
    <a href="#">Satisfação</a>
    <a href="#">Tags</a>
    <a href="#">Individual</a>
</div>

<div class="main">
    <h1>Visão Geral</h1>

    <div class="cards">
        <div class="card">
            Total de Tickets
            <strong>1250</strong>
        </div>

        <div class="card">
            Tickets Resolvidos
            <strong>1080</strong>
        </div>

        <div class="card">
            Taxa de Resolução
            <strong>86.4%</strong>
        </div>

        <div class="card">
            Tickets Pendentes
            <strong>120</strong>
        </div>

        <div class="card">
            Tickets Cancelados
            <strong>50</strong>
        </div>

        <div class="card">
            Média de Satisfação
            <strong>4.7</strong>
        </div>
    </div>
</div>

</body>
</html>
