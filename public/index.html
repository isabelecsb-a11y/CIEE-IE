<!DOCTYPE html>
<html>
<head>
<title>Painel IE</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#14001f,#0b0014);
    color:white;
}

.container { padding:40px; }

.cards {
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card {
    background: rgba(255,255,255,0.05);
    padding:25px;
    border-radius:16px;
    border:1px solid #ff2aad;
    box-shadow:0 0 20px rgba(255,42,173,0.3);
}

.card strong {
    font-size:26px;
    color:#ff7a00;
}

button {
    margin-top:20px;
    background: linear-gradient(90deg,#ff2aad,#ff7a00);
    border:none;
    padding:12px 20px;
    border-radius:10px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>Visão Geral</h1>

<input type="file" id="file">
<button onclick="upload()">Upload Excel</button>

<div class="cards" id="cards"></div>

<canvas id="grafico" height="100"></canvas>

</div>

<script src="app.js"></script>
</body>
</html>
