<!DOCTYPE html>
<html>
<head>
  <title>Painel IE</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1e293b;
    }

    .container {
      padding: 40px;
      max-width: 1400px;
      margin: auto;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .tab {
      padding: 10px 18px;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      transition: 0.3s;
    }

    .tab.active {
      background: #1e3a8a;
      color: white;
    }

    .upload-box {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card span {
      font-size: 13px;
      color: #64748b;
    }

    .card strong {
      display: block;
      font-size: 24px;
      margin-top: 6px;
      color: #1e3a8a;
    }

    canvas {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Painel de Indicadores IE</h1>

  <div class="tabs">
    <div class="tab active" onclick="trocarAba('geral')">Visão Geral</div>
    <div class="tab" onclick="trocarAba('mensal')">Mensal</div>
    <div class="tab" onclick="trocarAba('anual')">Anual</div>
    <div class="tab" onclick="trocarAba('satisfacao')">Satisfação</div>
    <div class="tab" onclick="trocarAba('individual')">Individual</div>
  </div>

  <div class="upload-box">
    <input type="file" id="file">
    <button onclick="upload()">Enviar Relatório</button>
  </div>

  <div id="conteudo"></div>

  <canvas id="grafico" height="100"></canvas>

</div>

<script src="app.js"></script>
</body>
</html>
